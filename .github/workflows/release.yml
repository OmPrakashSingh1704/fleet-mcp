name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Check tag matches flotilla_mcp.__version__
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python scripts/check_tag_version.py "$REF_NAME"
      - run: python -m pytest tests -m "not docker" -W error::DeprecationWarning -W error::pytest.PytestUnhandledCoroutineWarning

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build==1.6.1 twine==7.0.0 hatchling==1.32.3 hatch-fancy-pypi-readme==25.1.0
      - run: python -m build --outdir dist .
      - run: python -m twine check --strict dist/*
      - name: Smoke-install the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import flotilla_mcp; print(flotilla_mcp.__version__)"
          /tmp/smoke/bin/flotilla-self-dev --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flotilla-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flotilla-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        # Idempotent: a re-run of this job (e.g. after a transient failure
        # downstream) must not fail just because the release already exists
        # from a previous attempt -- upload the artifacts to it instead,
        # clobbering any that were already uploaded.
        run: |
          if gh release view "$REF_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$REF_NAME" dist/* --repo "${{ github.repository }}" --title "$REF_NAME" --generate-notes --verify-tag
          fi
