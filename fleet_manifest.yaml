# Fleet manifest. `container` opts a service into deploy-watcher blue/green
# deploys. `health_check` is informational only: the watcher always probes
# http://<service>-<sha>:8080/health on the mcp-fleet network.
services:
  fixture-hello-mcp:
    path: flotilla_mcp/fixture_hello_mcp
    protected: false
    container: fixture-hello-mcp
    health_check: http://fixture-hello-mcp:8080/health
  # Compose-managed only for this release: no `container`, so the deploy
  # watcher skips it. An operator updates it with `docker compose up --build`
  # (see ARCHITECTURE.md and SECURITY.md#known-limitations).
  self-dev-mcp:
    path: flotilla_mcp/self_dev_mcp
    protected: false
  deploy-watcher:
    path: flotilla_mcp/deploy_watcher
    protected: true
  permission-manager:
    path: flotilla_mcp/permission_manager
    protected: true
  mcp-gateway:
    path: flotilla_mcp/mcp_gateway
    protected: true
