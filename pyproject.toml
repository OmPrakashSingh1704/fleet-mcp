[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "fleetmcp"
dynamic = ["version", "readme"]
description = "A self-developing fleet of MCP servers, with guardrails."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "OmPrakashSingh1704" }]
keywords = ["mcp", "model-context-protocol", "agents", "self-development", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "mcp>=1.2,<1.3",
    "PyGithub>=2.4,<3",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "anyio>=4.7,<5",
]

[project.optional-dependencies]
watcher = ["docker>=7.1,<8"]

[project.scripts]
fleetmcp = "fleetmcp.self_dev_mcp.server:main"
fleetmcp-self-dev = "fleetmcp.self_dev_mcp.server:main"
fleetmcp-watcher = "fleetmcp.deploy_watcher.cli:main"

[project.urls]
Homepage = "https://github.com/OmPrakashSingh1704/fleet-mcp"
Source = "https://github.com/OmPrakashSingh1704/fleet-mcp"
Issues = "https://github.com/OmPrakashSingh1704/fleet-mcp/issues"
Changelog = "https://github.com/OmPrakashSingh1704/fleet-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/OmPrakashSingh1704/fleet-mcp/blob/main/SECURITY.md"

[tool.hatch.version]
path = "fleetmcp/__init__.py"

# README.md keeps relative links so they work on GitHub; pypi.org does not
# resolve relative links or images against a repository, so this hook
# rewrites them to absolute GitHub URLs when building the sdist/wheel
# metadata. Requires the target repository to be public -- see
# RELEASING.md#prerequisites-one-time.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Relative markdown links, e.g. "](SECURITY.md#known-limitations)" or
# "](docs/acceptance-checklist.md)", become absolute GitHub blob links,
# anchors preserved. Skips absolute URLs ("](https://...)") and in-page
# anchors ("](#...)").
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/OmPrakashSingh1704/fleet-mcp/blob/main/\1)'

# The logo's <picture>/<img> src="assets/..." and srcset="assets/..." become
# absolute raw.githubusercontent.com URLs.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="assets/'
replacement = '\1="https://raw.githubusercontent.com/OmPrakashSingh1704/fleet-mcp/main/assets/'

# The badge <a href="LICENSE">/<a href="CONTRIBUTING.md"> wrappers become
# absolute GitHub blob links, for the same reason as the markdown-link
# substitution above (skips absolute URLs and in-page anchors).
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<a href="(?!https?://|#)([^"]+)"'
replacement = '<a href="https://github.com/OmPrakashSingh1704/fleet-mcp/blob/main/\1"'

[tool.hatch.build.targets.wheel]
packages = ["fleetmcp"]
exclude = [
    "fleetmcp/fixture_hello_mcp",
    "**/Dockerfile",
    "**/entrypoint.sh",
]

[tool.hatch.build.targets.sdist]
include = [
    "fleetmcp",
    "tests",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "fleet_manifest.yaml",
    "requirements.txt",
    "requirements-dev.txt",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "docker: integration tests that require a real, reachable Docker daemon",
]
