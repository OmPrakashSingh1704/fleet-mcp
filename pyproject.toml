[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fleetmcp"
dynamic = ["version"]
description = "A self-developing fleet of MCP servers, with guardrails."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "OmPrakashSingh1704" }]
keywords = ["mcp", "model-context-protocol", "agents", "self-development", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "mcp>=1.2,<1.3",
    "PyGithub>=2.4,<3",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "anyio>=4.7,<5",
]

[project.optional-dependencies]
watcher = ["docker>=7.1,<8"]

[project.scripts]
fleetmcp = "fleetmcp.self_dev_mcp.server:main"
fleetmcp-self-dev = "fleetmcp.self_dev_mcp.server:main"
fleetmcp-watcher = "fleetmcp.deploy_watcher.cli:main"

[project.urls]
Homepage = "https://github.com/OmPrakashSingh1704/fleet-mcp"
Source = "https://github.com/OmPrakashSingh1704/fleet-mcp"
Issues = "https://github.com/OmPrakashSingh1704/fleet-mcp/issues"
Changelog = "https://github.com/OmPrakashSingh1704/fleet-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/OmPrakashSingh1704/fleet-mcp/blob/main/SECURITY.md"

[tool.hatch.version]
path = "fleetmcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fleetmcp"]
exclude = [
    "fleetmcp/fixture_hello_mcp",
    "**/Dockerfile",
    "**/entrypoint.sh",
]

[tool.hatch.build.targets.sdist]
include = [
    "fleetmcp",
    "tests",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "fleet_manifest.yaml",
    "requirements.txt",
    "requirements-dev.txt",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "docker: integration tests that require a real, reachable Docker daemon",
]
