<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" role="img" aria-labelledby="fleetmcp-logo-title fleetmcp-logo-desc">
  <title id="fleetmcp-logo-title">Fleet MCP</title>
  <desc id="fleetmcp-logo-desc">Logo for Fleet MCP: a stylized navy cargo ship hull carrying six rounded server containers, each with a small teal status node, sailing over a teal wave line, beside the wordmark "Fleet MCP".</desc>
  <style>
    .hull { fill: #1B2A4A; }
    .wave { stroke: #0F9488; }
    .container { fill: #EDF1F7; stroke: #1B2A4A; stroke-width: 0.5; }
    .node { fill: #0F9488; }
    .wordmark { fill: #14213B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .accent { fill: #0F9488; }
    @media (prefers-color-scheme: dark) {
      .hull { fill: #3E6E8C; }
      .wave { stroke: #2DD4BF; }
      .wordmark { fill: #F1F5F9; }
      .accent { fill: #2DD4BF; }
    }
  </style>
  <g transform="translate(14,15) scale(1.4)">
    <path class="wave" d="M0,54 Q8,49 16,54 T32,54 T48,54 T64,54" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon class="hull" points="6,36 52,36 58,44 50,50 14,50"/>
    <rect class="container" x="8.0" y="26" width="6.2" height="10" rx="1.4"/>
    <circle class="node" cx="11.1" cy="29" r="1.1"/>
    <rect class="container" x="15.2" y="23" width="6.2" height="13" rx="1.4"/>
    <circle class="node" cx="18.3" cy="26" r="1.1"/>
    <rect class="container" x="22.4" y="20" width="6.2" height="16" rx="1.4"/>
    <circle class="node" cx="25.5" cy="23" r="1.1"/>
    <rect class="container" x="29.6" y="22.5" width="6.2" height="13.5" rx="1.4"/>
    <circle class="node" cx="32.7" cy="25.5" r="1.1"/>
    <rect class="container" x="36.8" y="25" width="6.2" height="11" rx="1.4"/>
    <circle class="node" cx="39.9" cy="28" r="1.1"/>
    <rect class="container" x="44.0" y="27" width="6.2" height="9" rx="1.4"/>
    <circle class="node" cx="47.1" cy="30" r="1.1"/>
  </g>
  <text class="wordmark" x="130" y="74" font-size="46">Fleet <tspan class="accent">MCP</tspan></text>
</svg>
