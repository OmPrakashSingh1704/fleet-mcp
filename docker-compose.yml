networks:
  mcp-fleet:
    name: mcp-fleet

volumes:
  watcher-data:

services:
  # Local smoke-test target for the deploy watcher's build/run/health-check
  # cycle -- not part of the guarded fleet itself.
  fixture-hello-mcp:
    build:
      context: .
      dockerfile: fleetmcp/fixture_hello_mcp/Dockerfile
    image: fixture-hello-mcp
    restart: unless-stopped
    networks:
      - mcp-fleet
    ports:
      - "8081:8080"
    healthcheck:
      # Slim python images don't ship curl; a stdlib urllib one-liner avoids
      # adding a package just for the healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  self-dev-mcp:
    build:
      context: .
      dockerfile: fleetmcp/self_dev_mcp/Dockerfile
    image: self-dev-mcp
    restart: unless-stopped
    networks:
      - mcp-fleet
    ports:
      # Bound to loopback only: the SSE endpoint (/sse, /messages/) has no
      # authentication of its own, so this must not be reachable from
      # outside this host by default -- see SECURITY.md#known-limitations.
      - "127.0.0.1:8082:8080"
    # Compose-managed only: fleet_manifest.yaml gives self-dev-mcp no
    # `container`, so the deploy watcher never redeploys it. Update it with
    # `docker compose up --build self-dev-mcp`.
    environment:
      SELF_DEV_REPO_REMOTE: ${SELF_DEV_REPO_REMOTE}
      SELF_DEV_GITHUB_TOKEN: ${SELF_DEV_GITHUB_TOKEN}
      GITHUB_REPO_FULL_NAME: ${GITHUB_REPO_FULL_NAME}
      SELF_DEV_TEST_TIMEOUT_SECONDS: ${SELF_DEV_TEST_TIMEOUT_SECONDS:-600}
    # Deliberately no docker.sock mount, no REPO_REMOTE (that's the
    # watcher's variable, for the fleet repo it deploys), no
    # WATCHER_GITHUB_TOKEN, and no deploy credentials here -- this service
    # must never gain build/deploy authority over the fleet. It only ever
    # touches its own repo checkout via SELF_DEV_REPO_REMOTE +
    # SELF_DEV_GITHUB_TOKEN (GitHub API, and git via a credential helper).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  deploy-watcher:
    build:
      context: .
      dockerfile: fleetmcp/deploy_watcher/Dockerfile
    image: deploy-watcher
    restart: unless-stopped
    networks:
      - mcp-fleet
    environment:
      REPO_REMOTE: ${REPO_REMOTE}
      # Read-only token (contents: read): polling + checkout only.
      WATCHER_GITHUB_TOKEN: ${WATCHER_GITHUB_TOKEN}
      GITHUB_REPO_FULL_NAME: ${GITHUB_REPO_FULL_NAME}
      CHECKOUT_DIR: /data/checkout
      REGISTRY_PATH: /data/service_registry.json
      KNOWN_GOOD_PATH: /data/known_good.json
    volumes:
      # Grants build/run authority over every unprotected fleet service --
      # this is the one place in the fleet where that authority is allowed
      # to live (see fleet_manifest.yaml: deploy-watcher is protected).
      # Docker socket access is root-equivalent on the host: anyone who can
      # reach this socket can run arbitrary containers with arbitrary host
      # mounts, independent of which user inside the container holds it
      # (see fleetmcp/deploy_watcher/Dockerfile and entrypoint.sh for how
      # this container still drops to a non-root user at runtime).
      - /var/run/docker.sock:/var/run/docker.sock
      - watcher-data:/data
